
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="player">
        <h1>Music Player</h1>

        <div class="cover">
            <div class="music-icon">♫</div>
        </div>

        <h2 id="songTitle">Song Title</h2>
        <p id="artistName">Artist Name</p>

        <audio id="audio"></audio>

        <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100">
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prevBtn" aria-label="Previous song">⏮</button>
            <button id="playBtn" aria-label="Play or pause">▶</button>
            <button id="nextBtn" aria-label="Next song">⏭</button>
        </div>

        <div class="volume-container">
            <label for="volume">Volume 🔊</label>
            <input type="range" id="volume" min="0" max="1"
                   step="0.01" value="0.7">
        </div>

        <div class="playlist">
            <h3>Playlist</h3>
            <ul id="playlist"></ul>
        </div>

        <label class="autoplay">
            <input type="checkbox" id="autoplay" checked>
            Autoplay next song
        </label>
    </main>

    <script src="script.js"></script>
</body>
</html>
